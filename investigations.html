<script src="js/apparatus.js"></script>
<script src="js/records.js"></script>
<script src="js/site.js"></script>
<script>
  let hover = -1;
  Apparatus.mount(document.getElementById('cv-strip'), (S) => Apparatus.buildStrip(S, {
    records: RECORDS,
    hoverIndex: () => hover
  }));

  const list = document.getElementById('record-list');
  RECORDS.forEach((r, i) => {
    const row = document.createElement(r.withheld ? 'div' : 'a');
    row.className = 'record-row';
    if (!r.withheld) row.href = `record.html?id=${encodeURIComponent(r.id)}`;
    else row.style.cursor = 'default';
    row.addEventListener('mouseenter', () => { hover = i; });
    row.addEventListener('mouseleave', () => { hover = -1; });

    const rid = document.createElement('span');
    rid.className = 'rid'; rid.textContent = r.id;
    row.appendChild(rid);

    if (r.withheld) {
      const redacted = document.createElement('span');
      redacted.className = 'redacted';
      row.appendChild(redacted);
    } else {
      const title = document.createElement('span');
      title.className = 'title'; title.textContent = r.title;
      row.appendChild(title);
    }

    const status = document.createElement('span');
    status.className = 'status'; status.textContent = r.status;
    row.appendChild(status);

    list.appendChild(row);
  });
  const note = document.createElement('p');
  note.className = 'list-note';
  note.textContent = 'ENTRIES NOT LISTED ARE NOT MISSING.';
  list.appendChild(note);
</script>
