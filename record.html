<script src="js/apparatus.js"></script>

<script src="js/site.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const wanted = params.get('id');
  const rec = RECORDS.find(r => r.id === wanted) || RECORDS.find(r => !r.withheld) || RECORDS[0];

  const canonicalUrl = `https://probnaya.work/record?id=${encodeURIComponent(rec.id)}`;
  const pageTitle = `Record ${rec.id}: ${rec.title || rec.status} — PROBNAYA`;
  const pageDescription = rec.withheld
    ? `Record ${rec.id} is withheld in the PROBNAYA register of investigations.`
    : `${rec.title}. Question: ${rec.question}`;

  document.getElementById('page-title').textContent = pageTitle;
  document.getElementById('page-description').content = pageDescription;
  document.getElementById('og-url').content = canonicalUrl;
  document.getElementById('og-title').content = pageTitle;
  document.getElementById('og-description').content = pageDescription;
  document.getElementById('twitter-title').content = pageTitle;
  document.getElementById('twitter-description').content = pageDescription;
  const canonical = document.createElement('link');
  canonical.rel = 'canonical';
  canonical.href = canonicalUrl;
  document.head.appendChild(canonical);
  document.getElementById('record-schema').textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'CreativeWork',
    '@id': `${canonicalUrl}#record`,
    url: canonicalUrl,
    name: rec.title ? `Record ${rec.id}: ${rec.title}` : `Record ${rec.id}`,
    description: pageDescription,
    isPartOf: { '@id': 'https://probnaya.work/investigations#page' },
    creator: { '@id': 'https://probnaya.work/#laboratory', '@type': 'Organization', name: 'PROBNAYA' },
    publisher: { '@id': 'https://probnaya.work/#laboratory' }
  });
  document.getElementById('rec-id').textContent = `RECORD ${rec.id}`;
  document.getElementById('rec-status').textContent = rec.status;

  const body = document.getElementById('rec-body');

  if (rec.withheld) {
    body.innerHTML = `
      <div class="record-sealed">
        <span class="redacted"></span>
        <p>This record is withheld. It exists, it is indexed, and it is not disclosed.</p>
        <a class="action-link" href="/intake?ch=b">REQUEST ACCESS →</a>
      </div>`;
  } else {
    body.innerHTML = `
      <div class="record-open">
        <div style="display:flex; flex-direction:column; gap:26px;">
          <h2>${rec.title}</h2>
          <dl class="specs">
            <dt>QUESTION</dt><dd>${rec.question}</dd>
            <dt>APPARATUS</dt><dd>${rec.apparatus}</dd>
            <dt>FINDING</dt><dd class="accent">${rec.finding}</dd>
          </dl>
        </div>
        <div class="figure">
          <div class="figure-plate" style="height:180px;">
            <canvas id="cv-record"></canvas>
          </div>
          <div class="figure-caption">
            <span class="dim">FIG. 6 — READING TAKEN DURING ${rec.id}</span>
          </div>
        </div>
      </div>`;
    Apparatus.mount(document.getElementById('cv-record'), (S) => Apparatus.buildRecordReading(S, { kind: rec.reading }));
  }
</script>
